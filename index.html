<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rhythm">
<meta name="theme-color" content="#FFF6EF">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Rhythm</title>
<style>
:root {
  color-scheme: light only;
  /* palette */
  --navy: #274980; --yellow: #FFED4E; --aub: #4A1D3F; --cream: #FFF6EF; --moss: #A3B12F;
  --moss-deep: #5C6714; --yellow-deep: #7A6400;
  --navy-tint: #EBF0F7; --moss-tint: #F4F6E1; --yellow-tint: #FFF9D9; --aub-tint: #F6ECF2;

  --bg: var(--cream);
  --card: #FFFFFF;
  --ink: #1F2533;
  --muted: #6A6C76;
  --line: rgba(39, 73, 128, .12);
  --field: #FFFBF7;
  --accent: var(--navy);
  --accent-ink: #FFFFFF;
  --accent-soft: var(--navy-tint);
  --warn: #A2463A;
  --trigger: var(--aub);
  --shadow: 0 1px 2px rgba(74, 29, 63, .04), 0 6px 20px rgba(74, 29, 63, .05);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
}
main, .settings-inner { max-width: 560px; margin: 0 auto; padding: 0 16px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }

header.top { display: flex; align-items: center; gap: 12px; padding: 22px 0 18px; }
header.top .date { flex: 1; }
.date .dow { font-size: 15px; color: var(--muted); }
.date .day { font-size: 28px; font-weight: 700; letter-spacing: -.01em; color: var(--navy); }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--navy); fill: none; stroke-width: 1.8; }

.fog { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px 10px 18px; min-height: 64px; margin-bottom: 14px; width: 100%; text-align: left; box-shadow: var(--shadow); }
.fog .label { font-weight: 700; }
.fog .sub { font-size: 14px; color: var(--muted); }
.switch { width: 56px; height: 34px; border-radius: 20px; background: #DCD6D0; position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.fog[aria-pressed="true"] .switch { background: var(--accent); }
.fog[aria-pressed="true"] .switch::after { transform: translateX(22px); }

/* Cards: each section gets its own light tint; full color only on the header dot and buttons */
.card { --cbg: var(--card); --h: var(--navy); --dot: var(--navy); background: var(--cbg); border: 1px solid var(--line); border-radius: 22px; padding: 20px; margin-bottom: 22px; box-shadow: var(--shadow); }
.t-navy { --cbg: var(--navy-tint); --h: var(--navy); --dot: var(--navy); }
.t-moss { --cbg: var(--moss-tint); --h: var(--moss-deep); --dot: var(--moss); }
.t-yellow { --cbg: var(--yellow-tint); --h: var(--aub); --dot: var(--yellow); }
.t-aub { --cbg: var(--aub-tint); --h: var(--aub); --dot: var(--aub); }
.card h2 { font-size: 19px; font-weight: 750; letter-spacing: -.005em; color: var(--h); margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card h2 > span:first-child::before, .card h2.dot::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--dot); margin-right: 10px; vertical-align: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.card h2 .count { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.card h3 { font-size: 16px; font-weight: 700; margin: 20px 0 8px; color: var(--h); }
.card h3:first-of-type { margin-top: 4px; }

.program .name { font-size: 19px; font-weight: 700; line-height: 1.3; }
.program .week { color: var(--h); font-weight: 700; margin-top: 6px; }
.program .focus { margin-top: 6px; }
.program .focus.empty { color: var(--muted); font-style: italic; }
.bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.75); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; margin-top: 14px; }
.bar > div { height: 100%; background: var(--dot); border-radius: 6px; }
.bar-label { font-size: 14px; color: var(--muted); margin-top: 6px; }

.check { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 58px; padding: 8px 4px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; }
.check:first-of-type { border-top: 0; }
.box { width: 28px; height: 28px; border-radius: 9px; border: 2px solid rgba(39,73,128,.3); background: var(--card); flex: none; display: grid; place-items: center; transition: all .15s; }
.check[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.check[aria-pressed="true"] .box::after { content: ""; width: 7px; height: 13px; border: solid var(--accent-ink); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px,-1px); }
.check[aria-pressed="true"] .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.txt .note { display: block; font-size: 14px; color: var(--muted); }
.txt .note.extra { color: var(--navy); font-weight: 700; }
.check[aria-pressed="true"] .txt .note { color: var(--muted); font-weight: 400; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 12px; }
.days button { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); font-size: 15px; padding: 0; }
.days button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

/* Collapsible bits */
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
details.card > summary h2, details.fold > summary h2 { margin: 0; min-height: 30px; }
details.card[open] > summary h2, details.fold[open] > summary h2 { margin-bottom: 14px; }
.chev { display: inline-block; width: 9px; height: 9px; border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg); margin: 0 4px 3px 10px; transition: transform .2s; flex: none; }
details[open] > summary .chev { transform: rotate(-135deg); margin-bottom: -3px; }

details.reset { border-top: 1px solid var(--line); }
details.reset:first-of-type { border-top: 0; }
details.reset > summary { display: flex; align-items: center; gap: 8px; padding: 12px 2px; min-height: 58px; }
.reset .rname { flex: 1; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.reset .more { padding: 0 2px 16px; }
.reset .how { margin-bottom: 8px; }
.reset .ev { font-size: 15px; color: var(--muted); }
.reset .more ol { margin: 8px 0; padding-left: 22px; }
.reset .more li { margin: 3px 0; }
.reset .plain { margin: 4px 0 10px; padding: 10px 12px; border-radius: 12px; background: var(--aub-tint); color: var(--aub); font-size: 15px; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; background: var(--card); border: 1px solid currentColor; }
.tag.Good { color: var(--moss-deep); }
.tag.Moderate { color: var(--navy); }
.tag.Thin { color: var(--yellow-deep); }
.tag.Mixed { color: var(--aub); }
.tag.time { color: var(--muted); font-weight: 600; border-color: var(--line); }
.start-here { background: var(--card); border-radius: 16px; padding: 4px 14px; margin-bottom: 10px; }
.start-here .label { font-size: 13px; font-weight: 700; color: var(--navy); padding-top: 12px; letter-spacing: .05em; text-transform: uppercase; }
.hint { font-size: 14px; color: var(--muted); }

details.menu-sec { border-top: 1px solid var(--line); }
details.menu-sec:first-of-type { border-top: 0; }
details.menu-sec > summary { display: flex; align-items: center; gap: 8px; min-height: 58px; padding: 6px 2px; }
.menu-sec .sec { flex: 1; font-weight: 700; }
.menu-sec .sec .hint { display: block; font-weight: 400; }
.menu-sec .chips { padding: 0 0 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 14px; min-height: 44px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); display: inline-flex; align-items: center; }

textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--field); resize: vertical; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--navy); outline-offset: 1px; }
.saved { font-size: 13px; color: var(--muted); height: 18px; margin-top: 4px; }
details.past summary { padding: 12px 0 4px; color: var(--navy); font-weight: 600; min-height: 44px; }
.entry { border-top: 1px solid var(--line); padding: 10px 0; font-size: 15px; white-space: pre-wrap; }
.entry b { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }

.workouts { display: flex; align-items: center; gap: 16px; }
.workouts .num { font-size: 44px; font-weight: 700; line-height: 1; min-width: 56px; color: var(--navy); }
.workouts .of { color: var(--muted); font-size: 15px; flex: 1; }
.btn { min-height: 52px; padding: 0 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { min-height: 44px; padding: 0 14px; font-weight: 600; font-size: 15px; }
.btn.danger { color: var(--warn); }
.link { background: none; border: 0; color: var(--navy); font-weight: 600; padding: 10px 0; min-height: 44px; }

.big-trigger { display: block; width: 100%; min-height: 64px; border-radius: 20px; border: 0; background: var(--trigger); color: #fff; font-size: 19px; font-weight: 700; margin-bottom: 22px; box-shadow: 0 6px 18px rgba(74,29,63,.22); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar .inner { display: flex; max-width: 560px; margin: 0 auto; }
.tabbar button { flex: 1; min-height: 64px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 13px; font-weight: 600; color: var(--muted); }
.tabbar svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--navy); font-weight: 750; }
.sunday-link { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 64px; padding: 10px 18px; margin-bottom: 22px; border-radius: 18px; border: 1px solid var(--navy); background: var(--navy-tint); text-align: left; color: var(--navy); }
.sunday-link b { display: block; }
.sunday-link span { font-size: 14px; color: var(--muted); }
.more-link { display: block; width: 100%; min-height: 52px; margin-top: 12px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* Sprint */
.sprint .dates { font-size: 18px; font-weight: 700; }
.sprint details > summary { padding-bottom: 2px; }
.goals { display: grid; gap: 14px; margin-top: 18px; padding: 16px; border-radius: 16px; background: rgba(255,255,255,.7); }
.goal-k { font-size: 13px; font-weight: 700; color: var(--h); margin-bottom: 2px; letter-spacing: .03em; text-transform: uppercase; }
.goals ol { margin: 0; padding-left: 22px; }
.goals li { margin: 2px 0; }
.reminders { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: -8px 0 22px; }
.reminders div { min-height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-size: 18px; font-weight: 750; letter-spacing: .01em; }
.reminders .pitch { background: #274980; }
.plan-next { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 52px; margin-top: 14px; padding: 0 16px; border-radius: 14px; border: 0; background: var(--card); color: var(--moss-deep); font-weight: 750; text-align: left; box-shadow: inset 0 0 0 1.5px var(--moss); }
.reminders .post { background: #4A1D3F; }

.sheet-wrap { position: fixed; inset: 0; background: rgba(31,20,30,.38); z-index: 20; display: none; align-items: flex-end; }
.sheet-wrap.open { display: flex; }
.sheet { background: var(--bg); width: 100%; max-height: 92vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheet .inner { max-width: 528px; margin: 0 auto; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet h2 { margin: 0 0 16px; font-size: 22px; color: var(--aub); }
.sheet h3 { color: var(--aub); }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.pick button { min-height: 56px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); padding: 8px 10px; }
.pick button[aria-pressed="true"] { background: var(--trigger); color: #fff; border-color: var(--trigger); font-weight: 700; }
.sheet .btn.primary { background: var(--trigger); border-color: var(--trigger); color: #fff; }
.row { display: flex; gap: 10px; margin-top: 12px; }
.row > * { flex: 1; }

.settings { position: fixed; inset: 0; background: var(--bg); z-index: 30; overflow-y: auto; display: none; padding-top: env(safe-area-inset-top); padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
.settings.open { display: block; }
.settings header { position: sticky; top: 0; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 14px 0; z-index: 2; }
.settings header h1 { font-size: 26px; margin: 0; color: var(--navy); }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select, .item input { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--field); }
.field textarea { min-height: 80px; }
.item { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.item input { flex: 1; min-width: 0; }
.mini { width: 40px; height: 48px; flex: none; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: grid; place-items: center; font-size: 16px; color: var(--muted); }
.mini.del { color: var(--warn); }
.add { display: flex; gap: 8px; margin-top: 4px; }
.add input { flex: 1; min-width: 0; min-height: 48px; border: 1px dashed rgba(39,73,128,.3); border-radius: 12px; padding: 0 12px; background: transparent; }
.add .btn { min-height: 48px; }
.reset-edit { border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; background: var(--field); }
.reset-edit .tools { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
.reset-edit .tools .mini { width: 48px; }
.checkline { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 8px; }
.checkline input { width: 22px; height: 22px; accent-color: var(--accent); }
.finished { border-top: 1px solid var(--line); padding: 10px 0; }
.finished b { display: block; }
.finished span { font-size: 14px; color: var(--muted); }
.subtabs { display: flex; gap: 8px; margin-bottom: 12px; }
.subtabs button { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); }
.subtabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.empty { color: var(--muted); font-style: italic; }
.tabbar button { font-size: 12px; }
.desk-btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); color: var(--navy); font-weight: 700; text-decoration: none; }
.item-link { display: inline-flex; align-items: center; min-height: 40px; margin: -8px 0 6px 46px; color: var(--navy); font-weight: 650; font-size: 15px; text-decoration: none; }
.tonight { background: var(--card); border-radius: 14px; padding: 12px 14px; box-shadow: inset 0 0 0 1px var(--line); }
.tonight.extra { box-shadow: inset 0 0 0 1.5px var(--moss); }
.tonight span { display: block; font-size: 12px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--moss-deep); }
.tonight b { font-size: 17px; }
.skin-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
.skin-week div { min-height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 14px; font-weight: 600; background: rgba(255,255,255,.75); color: var(--muted); }
.skin-week div.on { background: var(--moss-deep); color: #fff; }
.skin-week div.today { box-shadow: 0 0 0 2px var(--navy); }
.steps-list, .prompt-list { margin: 0; padding-left: 22px; }
.steps-list li, .prompt-list li { margin: 6px 0; }
.link-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
.link-tile { min-height: 96px; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; text-decoration: none; box-shadow: var(--shadow); }
.link-tile b { font-size: 19px; }
.link-tile span { font-size: 14px; opacity: .85; }
.link-tile.navy { background: var(--navy); }
.link-tile.aub { background: var(--aub); }
.obt { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: inset 0 0 0 1.5px var(--moss); }
.obt span { display: block; font-size: 12px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--moss-deep); }
.obt b { font-size: 17px; }
.nlist { list-style: none; margin: 0; padding: 0; }
.ngoal { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
.ngoal:first-child { border-top: 0; }
.nstat { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); flex: none; margin-top: 6px; }
.nstat.prog { border-color: var(--navy); background: linear-gradient(90deg, var(--navy) 50%, transparent 50%); }
.nstat.ok { border-color: var(--moss-deep); background: var(--moss-deep); }
.ngoal.done .nname { color: var(--muted); text-decoration: line-through; }
.nname { font-weight: 600; }
.nmeta { font-size: 14px; color: var(--muted); }
.nfoot { font-size: 14px; color: var(--muted); margin-top: 6px; }
.nfoot .link { padding: 0; min-height: 44px; font-size: 14px; }
.nerr { color: var(--warn); font-size: 14px; }
details.prompts { margin: -8px 0 8px 46px; }
details.prompts > summary { display: inline-flex; align-items: center; min-height: 44px; color: var(--navy); font-weight: 650; font-size: 15px; }
details.prompts ol { margin: 0 0 6px; padding: 12px 14px 12px 34px; border-radius: 14px; background: var(--navy-tint); font-size: 16px; }
details.prompts li { margin: 4px 0; }
.set-title { display: flex; flex-direction: column; align-items: flex-start; }
.set-title .back { padding: 0; min-height: 36px; font-size: 16px; }
.set-group { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 8px 4px 8px; }
.set-list { padding: 4px 18px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 64px; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; }
.set-row:first-child { border-top: 0; }
.set-row b { display: block; color: var(--navy); }
.set-row span { font-size: 14px; color: var(--muted); }
details.reset-edit > summary { display: flex; align-items: center; gap: 8px; min-height: 48px; font-weight: 700; }
details.reset-edit > summary .chev { margin-left: auto; }
details.reset-edit[open] > summary { margin-bottom: 10px; }
/* ---------- Color blocking ---------- */
/* Each tab gets its own solid color at the top; card headers are solid bands, bodies stay soft. */
body { --hero: var(--navy); --hero-ink: #fff; }
body[data-tab="body"] { --hero: var(--moss); --hero-ink: var(--ink); }
body[data-tab="calm"] { --hero: var(--aub); --hero-ink: #fff; }
body[data-tab="journal"] { --hero: var(--yellow); --hero-ink: var(--aub); }
body[data-tab="week"] { --hero: var(--moss-deep); --hero-ink: #fff; }
header.top { background: var(--hero); color: var(--hero-ink); margin: 0 -16px 22px; padding: 26px 20px 28px; border-radius: 0 0 28px 28px; }
header.top .date .dow { color: var(--hero-ink); opacity: .8; }
header.top .date .day { color: var(--hero-ink); }
header.top .icon-btn, header.top .desk-btn { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.35); color: var(--hero-ink); }
header.top .icon-btn svg { stroke: var(--hero-ink); }
body[data-tab="journal"] header.top .icon-btn, body[data-tab="journal"] header.top .desk-btn,
body[data-tab="body"] header.top .icon-btn, body[data-tab="body"] header.top .desk-btn { background: rgba(255,255,255,.55); border-color: rgba(0,0,0,.08); }

.card { --band: var(--navy); --band-ink: #fff; }
.t-navy { --band: var(--navy); --band-ink: #fff; }
.t-moss { --band: var(--moss); --band-ink: var(--ink); }
.t-yellow { --band: var(--yellow); --band-ink: var(--aub); }
.t-aub { --band: var(--aub); --band-ink: #fff; }
.card > h2, details.card > summary > h2 { background: var(--band); color: var(--band-ink); margin: -20px -20px 16px; padding: 15px 20px; border-radius: 21px 21px 0 0; min-height: 56px; }
details.card:not([open]) > summary > h2 { margin: -20px; border-radius: 21px; }
details.card[open] > summary > h2 { margin: -20px -20px 16px; }
.card > h2 > span:first-child::before, .card > summary > h2 > span:first-child::before { display: none; }
.card > h2 .count, .card > summary > h2 .count { color: var(--band-ink); opacity: .85; }
.card > summary > h2 .chev { border-color: var(--band-ink); }
.card { border: 0; }

/* Fog day toggle turns into a yellow block when it's on */
.fog[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--aub); }
.fog[aria-pressed="true"] .sub { color: var(--aub); opacity: .8; }
.fog[aria-pressed="true"] .switch { background: var(--aub); }

/* Active tab gets a pill in its tab color */
.tabbar .inner { padding: 6px 6px 0; gap: 4px; }
.tabbar button { border-radius: 16px; min-height: 58px; }
.tabbar button[aria-current="page"] { background: var(--hero); color: var(--hero-ink); }
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabbar" aria-label="Tabs"><div class="inner">
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-act="tab" data-tab="body"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.2-9.4C1.6 8 3.9 4.5 7.4 4.5c2 0 3.4 1.1 4.6 2.7 1.2-1.6 2.6-2.7 4.6-2.7 3.5 0 5.8 3.5 4.6 7.1C19.5 16.4 12 21 12 21z"/></svg>Body</button>
  <button data-act="tab" data-tab="calm"><svg viewBox="0 0 24 24"><path d="M3 9c3-3 6 3 9 0s6 3 9 0M3 15c3-3 6 3 9 0s6 3 9 0"/></svg>Calm</button>
  <button data-act="tab" data-tab="journal"><svg viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3M9 7.5h6"/></svg>Journal</button>
  <button data-act="tab" data-tab="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
</div></nav>

<div class="sheet-wrap" id="triggerSheet" role="dialog" aria-modal="true" aria-label="Log a trigger">
  <div class="sheet"><div class="inner" id="triggerInner"></div></div>
</div>

<div class="settings" id="settings" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="settings-inner">
    <header><div class="set-title"><button class="link back" data-act="setPage" data-p="" id="setBack" hidden>‹ Settings</button><h1 id="setTitle">Settings</h1></div><button class="btn primary small" data-act="closeSettings">Done</button></header>
    <div id="settingsBody"></div>
  </div>
</div>

<script>
const KEY = 'today-app-v1';

// ---------- Defaults ----------
const DEFAULT_SETTINGS = {
  program: {
    name: 'Retrain Your Brain: Cognitive Behavioral Therapy in 7 Weeks',
    weeks: 7,
    start: '2026-11-22',
    focus: ['', '', '', '', '', '', '']
  },
  finished: [],
  sprint: {
    start: '2026-11-16',
    end: '2026-12-13',
    revenue: '1 client',
    projects: ['SSS selling material', 'License decision by Dec 31'],
    life: ['Sobriety', 'CBT and somatic practice']
  },
  resets: [
    { name: 'Physiological sigh', start: true, level: 'Moderate',
      how: 'In through the nose, a second short sip of air on top, then a long slow breath out through the mouth. Repeat for 1 to 5 minutes.',
      note: 'A 2023 Stanford randomized trial found 5 minutes a day improved mood and lowered breathing rate a bit more than mindfulness did. Mindfulness helped anxiety just as much.' },
    { name: 'Self-soothing touch', start: true, level: 'Moderate',
      how: 'One hand on your chest, one on your belly. Press gently and breathe for 20 seconds.',
      note: 'In a 2021 study of 159 people, it lowered cortisol after a stress test about as well as a hug. Heart rate and how stressed people felt did not change.' },
    { name: 'Cold water on your face', start: true, level: 'Thin',
      how: 'Hold a cold wet cloth over your eyes and cheeks, or dip your face in cold water, for 15 to 30 seconds while holding your breath.',
      note: 'Triggers the dive reflex, which slows your heart. Small studies in panic disorder found it eased anxiety. Skip it if you have heart problems.' },
    { name: 'Slow breathing, long exhale', level: 'Moderate',
      how: 'Breathe in for 4, out for 6 to 8, for a few minutes.',
      note: 'A 2023 meta-analysis of 12 trials found a small to medium drop in stress, with similar results for anxiety and low mood. Many of the studies had some risk of bias.' },
    { name: 'Progressive muscle relaxation', level: 'Good', time: 'When you have time (about 10 min)',
      how: 'Tense one muscle group for 5 seconds, then let it go for 10. Work from your feet up to your face.',
      note: 'The most researched one here. Several reviews show it lowers anxiety, though how much varies between studies.' },
    { name: 'Orienting', level: 'Thin',
      how: 'Slowly turn your head and let your eyes land on things around you. Name a few and notice you are safe right now.',
      note: 'Comes from Somatic Experiencing, which did well in a 2017 PTSD trial. That trial tested the whole therapy, not orienting on its own.' },
    { name: '5-4-3-2-1 grounding', level: 'Thin',
      how: 'Name 5 things you see, 4 you can touch, 3 you hear, 2 you smell, and 1 you taste.',
      note: 'Widely used by clinicians and very low risk. The only direct study is one small one on test anxiety.' },
    { name: 'Humming', level: 'Thin',
      how: 'Breathe in, then hum on a long steady exhale. Repeat 5 to 10 times.',
      note: 'Raises nitric oxide in the nose, and small studies show short-term heart rate variability changes. Claims about stimulating the vagus nerve go past the evidence.' },
    { name: 'Butterfly hug', level: 'Thin',
      how: 'Cross your arms over your chest, fingertips under your collarbones. Tap left, right, left, right, slowly, while you breathe.',
      note: 'Developed by a trauma clinician in 1998 and used a lot in EMDR therapy. Support is mostly field reports. No controlled trial of the hug alone.' },
    { name: 'Shaking', level: 'Thin',
      how: 'Stand with soft knees and let your body bounce and shake loosely for 1 to 2 minutes.',
      note: 'Research on TRE (a structured shaking method) is mostly small exploratory studies. No good evidence it releases stored trauma, but it can burn off nervous energy. Check with a doctor first if you have a seizure or movement disorder.' },
    { name: 'EFT tapping', level: 'Mixed', eft: true,
      how: 'Rate how upset you feel from 0 to 10, tap through the points while saying a short phrase, then rate it again.',
      plain: 'The energy or meridian explanation is not supported by research. It may still help some people feel calmer.',
      note: 'A 2016 meta-analysis of 14 studies found less anxiety than control groups. Critics point to weak study methods, and one study found tapping the "wrong" points worked about as well.',
      steps: [
        'Name the feeling and rate it from 0 to 10.',
        'Tap the side of your hand and say 3 times: "Even though I feel [this], I accept myself."',
        'Tap each point about 7 times while repeating a short reminder phrase, like "this tightness."',
        'Take a breath and rate it again. Do another round if you need it.'
      ],
      points: ['Eyebrow', 'Side of the eye', 'Under the eye', 'Under the nose', 'Chin', 'Collarbone', 'Under the arm', 'Top of the head'] }
  ],
  menu: {
    Starters: ['Step outside for 2 minutes', 'Play one favorite song', 'Glass of cold water', 'Stretch', 'Text a friend'],
    Mains: ['30 minute walk', 'Workout', 'Creative project', 'Cook something new'],
    Sides: ['Podcast while doing chores', 'Light a candle', 'Music while working'],
    Desserts: ['One episode of a show', '15 minutes of scrolling, timer on', 'A treat'],
    Specials: ['Day trip', 'Concert or show', 'Massage']
  },
  checklists: {
    morning: {
      normal: ['Make bed', 'Water', 'Walk dog', 'Workout', 'Breakfast', 'Vitamins', 'Journal', 'Open the daily brief'],
      fog: ['Drink a glass of water', 'Meds or vitamins', 'One reset from Start here', 'Step outside for 2 minutes', 'Pick one thing for today', 'Journal', 'Open the daily brief']
    },
    night: {
      normal: ['Vitamins', 'Skin routine', 'Brain dump', 'Log what I ate'],
      fog: ['Brain dump', 'Skin routine']
    }
  },
  journal: {
    item: 'Journal',
    prompts: ["What emotion is loudest this morning?", "What's the one thing that matters most today?", "Name 3 small things I'm grateful for."]
  },
  brainDump: {
    item: 'Brain dump',
    prompts: ["What's one thing I did well today?", "What's still on my mind right now?", "Is there anything I'm dreading? What would make it 10% easier?", "What's the first small thing I'll do in the morning?"]
  },
  links: {
    desk: { label: 'Daily Desk', url: 'https://claude.ai/artifact/2BENMuFoR9i3GA1S8Mn2ct' },
    strong: { label: 'Vero Strong', url: 'https://createwithvero.github.io/vero-strong/' },
    gut: { label: 'Gut Log', url: 'https://createwithvero.github.io/gut-log/' }
  },
  itemLinks: { 'workout': 'strong', 'log what i ate': 'gut' },
  skin: {
    item: 'Skin routine',
    days: [1, 3, 5],
    extra: 'tretinoin + scalp oil tonight',
    basic: 'basic routine only',
    steps: { morning: [], night: [] }
  },
  sunday: {
    normal: ['Brain dump in notebook', "Sort the week's nightly pages", 'Check the calendar', "Seed next week's posts", "Pick this week's 3 actions", 'CBT chapter and questions', 'Report in Monday'],
    fog: ['Brain dump', 'Pick 3 actions']
  },
  weeklyTasks: [],
  triggers: ['Poor sleep', 'Skipped a meal', 'Conflict', 'Overwhelm', 'Social media', 'Noise or crowds', 'Work stress'],
  workoutGoal: 4
};

// ---------- Date helpers ----------
function pad(n) { return String(n).padStart(2, '0'); }
function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function today0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b) { return Math.round((b - a) / 864e5); }
function nextSunday() { const t = today0(); const add = (7 - t.getDay()) % 7 || 7; return keyOf(addDays(t, add)); }
function fmt(d, opts) { return d.toLocaleDateString(undefined, opts); }
function fmtKey(k, opts) { return fmt(parseKey(k), opts || { month: 'short', day: 'numeric', year: 'numeric' }); }
function weekStart(d) { return addDays(d, -((d.getDay() + 6) % 7)); } // Monday

// ---------- State ----------
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!s || typeof s !== 'object') s = {};
  s.settings = Object.assign(clone(DEFAULT_SETTINGS), s.settings || {});
  s.days = s.days || {};
  s.triggerLog = s.triggerLog || [];
  s.workouts = s.workouts || [];
  s.weeks = s.weeks || {};
  s.settings.skin = Object.assign(clone(DEFAULT_SETTINGS.skin), s.settings.skin || {});
  s.settings.skin.steps = Object.assign({ morning: [], night: [] }, s.settings.skin.steps || {});
  s.settings.links = Object.assign(clone(DEFAULT_SETTINGS.links), s.settings.links || {});
  const m = s.settings.checklists && s.settings.checklists.morning;
  if (m && JSON.stringify(m.normal) === JSON.stringify(['Drink a glass of water', 'Meds or vitamins', 'Make the bed', 'Morning light for 10 minutes', 'Move my body', 'Pick my top 3 for today'])) m.normal = clone(DEFAULT_SETTINGS.checklists.morning.normal);
  s.migrated = s.migrated || {};
  if (m && !s.migrated.journal) {
    for (const mode of ['normal', 'fog']) {
      const list = (m[mode] || []).filter(x => !['Daily brief', 'Open the daily brief', 'Journal'].includes(x.trim()));
      m[mode] = list.concat(['Journal', 'Open the daily brief']);
    }
    s.migrated.journal = true;
  }
  const n = s.settings.checklists && s.settings.checklists.night;
  if (n && JSON.stringify(n.normal) === JSON.stringify(['10 minute tidy', 'Set out things for tomorrow', 'Screens away', 'Read for a bit', 'Fill in what I ate'])) n.normal = clone(DEFAULT_SETTINGS.checklists.night.normal);
  if (n && JSON.stringify(n.fog) === JSON.stringify(['Brush teeth', 'Water by the bed', 'Lights out'])) n.fog = clone(DEFAULT_SETTINGS.checklists.night.fog);
  s.settings.sprint = Object.assign(clone(DEFAULT_SETTINGS.sprint), s.settings.sprint || {});
  return s;
}
let state = load();
let saveFailed = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); saveFailed = false; }
  catch (e) { if (!saveFailed) alert('Could not save. Storage may be full or blocked.'); saveFailed = true; }
}
const S = () => state.settings;
function todayKey() { return keyOf(today0()); }
function day() { const k = todayKey(); return state.days[k] || (state.days[k] = { fog: false, checks: {}, food: '' }); }

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ---------- Program ----------
function progInfo(p) {
  const start = parseKey(p.start);
  const total = Math.max(1, Number(p.weeks) || 1) * 7;
  const d = daysBetween(start, today0());
  if (d < 0) return { status: 'upcoming', daysUntil: -d, total };
  if (d >= total) return { status: 'done', total, end: keyOf(addDays(start, total - 1)) };
  return { status: 'active', week: Math.floor(d / 7) + 1, dayNum: d + 1, total, pct: (d + 1) / total };
}
function archiveIfEnded() {
  const p = S().program;
  if (!p || !p.start) return;
  const info = progInfo(p);
  if (info.status === 'done') {
    S().finished.unshift({ name: p.name, weeks: p.weeks, start: p.start, end: info.end, focus: p.focus, early: false });
    S().program = null;
    save();
  }
}

// ---------- Rendering ----------
const GEAR = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`;

// Fog days open on the Calm tab, other days on Today.
let tab = day().fog ? 'calm' : 'today';

// Morning opens until noon, Night opens from 6pm, both start folded in between.
function timeSlot() { const h = new Date().getHours(); return h < 12 ? 'morning' : h >= 18 ? 'night' : 'midday'; }
let clOpen = {};
let shownSlot = timeSlot();

function render() {
  archiveIfEnded();
  const t = today0();
  let top, body;
  if (tab === 'today') {
    top = `<div class="dow">${esc(fmt(t, { weekday: 'long' }))}</div><div class="day">${esc(fmt(t, { month: 'long', day: 'numeric' }))}</div>`;
    body = todayTab();
  } else {
    const titles = { body: 'Body', calm: 'Calm', journal: 'Journal', week: 'Week' };
    top = `<div class="dow">${esc(fmt(t, { weekday: 'long', month: 'long', day: 'numeric' }))}</div><div class="day">${titles[tab] || ''}</div>`;
    body = tab === 'body' ? bodyTab()
      : tab === 'calm' ? resetsCard() + menuCard()
      : tab === 'journal' ? journalTab()
      : weeklyCard() + sundayCard();
  }
  document.getElementById('app').innerHTML = `
    <header class="top">
      <div class="date">${top}</div>
      ${linkUrl('desk') ? `<a class="desk-btn" href="${esc(linkUrl('desk'))}" target="_blank" rel="noopener">Desk</a>` : ''}
      <button class="icon-btn" data-act="openSettings" aria-label="Settings">${GEAR}</button>
    </header>
    ${body}`;
  document.querySelectorAll('.tabbar button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  document.body.dataset.tab = tab;
}

// Remembers which folded sections are open, so ticking a box doesn't snap them shut.
function isOpen(id, fallback) { return id in clOpen ? clOpen[id] : fallback; }
const CHEV = '<span class="chev"></span>';

function todayTab() {
  const d = day();
  const slot = timeSlot();
  // Both lists always show. The time of day only decides which one starts open.
  const lists = ['morning', 'night'];
  let sundayLink = '';
  if (today0().getDay() === 0) {
    const { done, total } = sundayProgress();
    sundayLink = `<button class="sunday-link" data-act="tab" data-tab="week"><div><b>It's Sunday reset day</b><span>${done} of ${total} done · open in Week</span></div><span class="chev" style="transform:rotate(-45deg)"></span></button>`;
  }
  return `
    <button class="fog" data-act="toggleFog" aria-pressed="${d.fog}">
      <div><div class="label">Fog day</div><div class="sub">${d.fog ? 'Gentle mode. Lighter lists, opens on Calm.' : 'Turn on for a lighter day'}</div></div>
      <div class="switch"></div>
    </button>
    <button class="big-trigger" data-act="openTrigger">Log a trigger</button>
    ${sundayLink}
    ${lists.map(w => checklistCard(w, slot)).join('')}
    ${startHereCard()}`;
}

function startHereCard() {
  const pinned = S().resets.filter(r => r.start);
  return `<section class="card t-navy"><h2><span>Start here</span></h2>
    ${pinned.map(resetItem).join('') || '<div class="hint">Pin resets to Start here in Settings.</div>'}
    <button class="more-link" data-act="tab" data-tab="calm">More resets</button>
  </section>`;
}

function programCard() {
  const p = S().program;
  if (!p) {
    return `<section class="card t-aub program"><h2><span>Program</span></h2>
      <div class="empty">No program running right now.</div>
      <button class="btn primary" style="margin-top:12px" data-act="newProgram">Start a new program</button></section>`;
  }
  const info = progInfo(p);
  let body = '';
  if (info.status === 'upcoming') {
    const when = info.daysUntil === 1 ? 'tomorrow' : 'in ' + info.daysUntil + ' days';
    body = `<div class="week">Starts ${esc(fmtKey(p.start, { weekday: 'long', month: 'short', day: 'numeric' }))}, ${when}</div>
      <div class="bar"><div style="width:0%"></div></div>
      <div class="bar-label">Week 1 of ${p.weeks} is up next</div>`;
  } else {
    const focus = (p.focus || [])[info.week - 1];
    body = `<div class="week">Week ${info.week} of ${p.weeks}</div>
      <div class="focus ${focus ? '' : 'empty'}">${focus ? esc(focus) : 'Add this week\'s focus in Settings'}</div>
      <div class="bar" role="progressbar" aria-valuenow="${Math.round(info.pct * 100)}" aria-valuemin="0" aria-valuemax="100"><div style="width:${(info.pct * 100).toFixed(1)}%"></div></div>
      <div class="bar-label">Day ${info.dayNum} of ${info.total} · ${Math.round(info.pct * 100)}%</div>`;
  }
  return `<section class="card t-aub program"><h2><span>Program</span></h2><div class="name">${esc(p.name || 'Untitled program')}</div>${body}</section>`;
}

// Resets show only the name and evidence tag. Tap to see the how-to.
function resetItem(r) {
  const id = 'r:' + r.name;
  const more = r.eft ? `
      <div class="how">${esc(r.how)}</div>
      ${r.plain ? `<div class="plain">${esc(r.plain)}</div>` : ''}
      <ol>${(r.steps || []).map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      <div><b>Tapping points, in order</b></div>
      <ol>${(r.points || []).map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      ${r.note ? `<div class="ev">${esc(r.note)}</div>` : ''}` : `
      <div class="how">${esc(r.how)}</div>
      ${r.note ? `<div class="ev">${esc(r.note)}</div>` : ''}`;
  return `<details class="reset" data-id="${esc(id)}" ${isOpen(id, false) ? 'open' : ''}><summary>
      <div class="rname">${esc(r.name)} ${r.level ? `<span class="tag ${esc(r.level)}">${esc(r.level)} evidence</span>` : ''} ${r.time ? `<span class="tag time">${esc(r.time)}</span>` : ''}</div>${CHEV}
    </summary>
    <div class="more">${more}</div>
  </details>`;
}
function resetsCard() {
  const all = S().resets;
  const pinned = all.filter(r => r.start);
  const rest = all.filter(r => !r.start);
  return `<section class="card t-navy"><h2><span>Somatic resets</span></h2>
    ${pinned.length ? `<div class="start-here"><div class="label">Start here</div>${pinned.map(resetItem).join('')}</div>` : ''}
    ${rest.map(resetItem).join('')}
  </section>`;
}

const MENU_SECTIONS = ['Starters', 'Mains', 'Sides', 'Desserts', 'Specials'];
const MENU_HINTS = { Starters: 'quick, 5 minutes or less', Mains: 'bigger and more filling', Sides: 'pair with boring tasks', Desserts: 'fun, use with a limit', Specials: 'once in a while' };
function menuCard() {
  return `<section class="card t-yellow"><h2><span>Dopamine menu</span></h2>
    ${MENU_SECTIONS.map(sec => {
      const items = S().menu[sec] || [];
      const id = 'm:' + sec;
      return `<details class="menu-sec" data-id="${id}" ${isOpen(id, false) ? 'open' : ''}><summary>
        <div class="sec">${sec} <span class="hint">${MENU_HINTS[sec]}</span></div><span class="hint">${items.length}</span>${CHEV}</summary>
        <div class="chips">${items.map(i => `<span class="chip">${esc(i)}</span>`).join('') || '<span class="hint">Add some in Settings</span>'}</div>
      </details>`;
    }).join('')}
  </section>`;
}

// Tonight's skin note, based on which weekdays get the extra steps.
function itemNote(which, text) {
  const sk = S().skin;
  if (which !== 'night' || !sk || !sk.item || text.trim().toLowerCase() !== sk.item.trim().toLowerCase()) return '';
  const extra = (sk.days || []).includes(today0().getDay());
  const msg = extra ? sk.extra : sk.basic;
  return msg ? `<span class="note ${extra ? 'extra' : ''}">${esc(msg)}</span>` : '';
}

// Prompts sit under Journal (morning) and Brain dump (night). Fog days show only the first one.
function journalPrompts(which, text, fog) {
  const j = which === 'morning' ? S().journal : which === 'night' ? S().brainDump : null;
  if (!j || !j.item || text.trim().toLowerCase() !== j.item.trim().toLowerCase()) return '';
  const prompts = (j.prompts || []).filter(x => x.trim()).slice(0, fog ? 1 : undefined);
  if (!prompts.length) return '';
  const label = prompts.length === 1 ? '1 prompt' : prompts.length + ' prompts';
  const id = 'prompts:' + which;
  return `<details class="prompts" data-id="${id}" ${isOpen(id, false) ? 'open' : ''}>
    <summary>${label}<span class="chev"></span></summary>
    <ol>${prompts.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
  </details>`;
}

function checklistCard(which, slot) {
  const d = day();
  const mode = d.fog ? 'fog' : 'normal';
  const items = S().checklists[which][mode] || [];
  const k = i => which + ':' + mode + ':' + i;
  const done = items.filter(i => d.checks[k(i)]).length;
  const title = which === 'morning' ? 'Morning' : 'Night';
  return `<details class="card cl" data-id="${which}" ${isOpen(which, slot === which) ? 'open' : ''}><summary><h2><span>${title}${d.fog ? ' · fog' : ''}</span> <span class="count">${done} of ${items.length}${CHEV}</span></h2></summary>
    ${items.map(i => `<button class="check" data-act="check" data-key="${esc(k(i))}" aria-pressed="${!!d.checks[k(i)]}"><span class="box"></span><span class="txt">${esc(i)}${itemNote(which, i)}</span></button>${itemLink(i)}${journalPrompts(which, i, d.fog)}`).join('') || '<div class="hint">Add items in Settings</div>'}
  </details>`;
}

// Weeks run Sunday to Saturday, so both weekly lists reset every Sunday.
function weekKey() { const t = today0(); return keyOf(addDays(t, -t.getDay())); }
function week() { const k = weekKey(); return state.weeks[k] || (state.weeks[k] = { checks: {} }); }
function weekRow(k, text) {
  const w = week();
  return `<button class="check" data-act="wcheck" data-key="${esc(k)}" aria-pressed="${!!w.checks[k]}"><span class="box"></span><span class="txt">${esc(text)}</span></button>`;
}
function sundayProgress() {
  const mode = day().fog ? 'fog' : 'normal';
  const items = (S().sunday[mode] || []).slice();
  return { mode, items, total: items.length, done: items.filter(i => week().checks['sunday:' + mode + ':' + i]).length };
}
function weeklyCard() {
  const tasks = S().weeklyTasks || [];
  const done = tasks.filter(i => week().checks['task:' + i]).length;
  return `<details class="card" data-id="weekly" ${isOpen('weekly', true) ? 'open' : ''}><summary><h2><span>This week</span> <span class="count">${tasks.length ? `${done} of ${tasks.length}` : 'resets Sunday'}${CHEV}</span></h2></summary>
    ${tasks.map(i => weekRow('task:' + i, i)).join('') || '<div class="hint">Add recurring weekly tasks in Settings.</div>'}
  </details>`;
}
function sundayCard() {
  const { mode, items, done, total } = sundayProgress();
  const dow = today0().getDay();
  return `<details class="card t-navy" data-id="sunday" ${isOpen('sunday', dow === 0) ? 'open' : ''}><summary><h2><span>Sunday reset${mode === 'fog' ? ' · fog' : ''}</span> <span class="count">${done} of ${total}${CHEV}</span></h2></summary>
    ${items.map(i => weekRow('sunday:' + mode + ':' + i, i)).join('') || '<div class="hint">Add items in Settings</div>'}
  </details>`;
}

// ---------- Links out to your other apps ----------
function linkUrl(key) { const l = (S().links || {})[key]; return l && l.url ? l.url : ''; }
function linkLabel(key) { const l = (S().links || {})[key]; return l ? l.label : key; }
const ARROW = '<span class="chev" style="transform:rotate(-45deg);border-color:currentColor"></span>';
// Some checklist items get a small "Open ..." link under them, e.g. Workout opens Vero Strong.
function itemLink(text) {
  const map = S().itemLinks || {};
  const key = map[text.trim().toLowerCase()];
  const url = key && linkUrl(key);
  return url ? `<a class="item-link" href="${esc(url)}" target="_blank" rel="noopener">Open ${esc(linkLabel(key))}${ARROW}</a>` : '';
}

// ---------- Body tab ----------
const DAY_LETTERS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
function bodyTab() {
  const sk = S().skin;
  const dow = today0().getDay();
  const extraTonight = (sk.days || []).includes(dow);
  const steps = sk.steps || { morning: [], night: [] };
  const stepList = (arr, label) => (arr || []).filter(x => x.trim()).length
    ? `<h3>${label}</h3><ol class="steps-list">${arr.filter(x => x.trim()).map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : '';
  const anySteps = stepList(steps.morning, 'Morning') + stepList(steps.night, 'Night');
  const tile = (key, cls, sub) => linkUrl(key)
    ? `<a class="link-tile ${cls}" href="${esc(linkUrl(key))}" target="_blank" rel="noopener"><b>${esc(linkLabel(key))}</b><span>${sub}</span></a>` : '';
  return `
    <section class="card t-moss"><h2><span>Skincare</span></h2>
      <div class="tonight ${extraTonight ? 'extra' : ''}"><span>Tonight</span><b>${esc(extraTonight ? sk.extra : sk.basic)}</b></div>
      <div class="skin-week">${DAY_LETTERS.map((l, n) => `<div class="${(sk.days || []).includes(n) ? 'on' : ''} ${n === dow ? 'today' : ''}">${l}</div>`).join('')}</div>
      <div class="hint" style="margin-top:8px">Dark days get the extra steps.</div>
      ${anySteps || '<div class="hint" style="margin-top:14px">Add your morning and night skincare steps in Settings, then Skincare.</div>'}
    </section>
    <div class="link-tiles">
      ${tile('strong', 'navy', 'Workouts')}
      ${tile('gut', 'aub', 'Food and symptoms')}
    </div>`;
}

// ---------- Journal tab ----------
function promptCard(title, cls, cfg, fogNote) {
  const prompts = (cfg.prompts || []).filter(x => x.trim());
  return `<section class="card ${cls}"><h2><span>${title}</span></h2>
    ${prompts.length ? `<ol class="prompt-list">${prompts.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
    <div class="hint" style="margin-top:10px">${fogNote}</div>` : '<div class="hint">Add prompts in Settings, then Journal prompts.</div>'}
  </section>`;
}
function journalTab() {
  const past = Object.keys(state.days).filter(x => state.days[x].food && state.days[x].food.trim()).sort().reverse();
  return `
    ${promptCard('Morning journal', '', S().journal, 'On fog days, just the first one.')}
    ${promptCard('Night brain dump', 't-navy', S().brainDump, 'On fog nights, just the first one.')}
    ${programCard()}
    ${past.length ? `<details class="card" data-id="oldfood" ${isOpen('oldfood', false) ? 'open' : ''}><summary><h2><span>Old food notes</span> <span class="count">${past.length}${CHEV}</span></h2></summary>
      <div class="hint" style="margin-bottom:6px">From before food moved to Gut Log.</div>
      ${past.map(x => `<div class="entry"><b>${esc(fmtKey(x, { weekday: 'short', month: 'short', day: 'numeric' }))}</b>${esc(state.days[x].food)}</div>`).join('')}
    </details>` : ''}`;
}

// ---------- Trigger sheet ----------
let pickedTrigger = null;
function renderTriggerSheet() {
  const tk = todayKey();
  const todays = state.triggerLog.filter(e => keyOf(new Date(e.ts)) === tk);
  const recent = state.triggerLog.filter(e => keyOf(new Date(e.ts)) !== tk).slice(0, 30);
  const time = ts => new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  const row = e => `<div class="entry"><b>${esc(e.trigger)} · ${time(e.ts)}</b>${e.note ? esc(e.note) : ''}</div>`;
  document.getElementById('triggerInner').innerHTML = `
    <div class="grab"></div>
    <h2>What set it off?</h2>
    <div class="pick">${S().triggers.map(t => `<button data-act="pickTrigger" data-t="${esc(t)}" aria-pressed="${pickedTrigger === t}">${esc(t)}</button>`).join('')}</div>
    <textarea id="triggerNote" placeholder="Note (optional)" style="min-height:80px"></textarea>
    <div class="row">
      <button class="btn" data-act="closeTrigger">Cancel</button>
      <button class="btn primary" data-act="saveTrigger" ${pickedTrigger ? '' : 'disabled style="opacity:.5"'}>Save</button>
    </div>
    <h3 style="margin:22px 0 4px">Today ${todays.length ? `(${todays.length})` : ''}</h3>
    ${todays.length ? todays.map(row).join('') : '<div class="hint">Nothing logged today.</div>'}
    ${recent.length ? `<details class="past"><summary>Earlier</summary>${recent.map(e => `<div class="entry"><b>${esc(e.trigger)} · ${esc(fmt(new Date(e.ts), { weekday: 'short', month: 'short', day: 'numeric' }))}, ${time(e.ts)}</b>${e.note ? esc(e.note) : ''}</div>`).join('')}</details>` : ''}
  `;
}
function openTrigger() { pickedTrigger = null; renderTriggerSheet(); document.getElementById('triggerSheet').classList.add('open'); }
function closeTrigger() { document.getElementById('triggerSheet').classList.remove('open'); }

// ---------- Settings ----------
let settingsTab = { morning: 'normal', night: 'normal', sunday: 'normal' };
function listEditor(path, items, placeholder) {
  return `${items.map((it, i) => `<div class="item">
      <input value="${esc(it)}" data-edit="list" data-path="${path}" data-i="${i}" aria-label="Item ${i + 1}">
      <button class="mini" data-act="move" data-path="${path}" data-i="${i}" data-dir="-1" aria-label="Move up">↑</button>
      <button class="mini" data-act="move" data-path="${path}" data-i="${i}" data-dir="1" aria-label="Move down">↓</button>
      <button class="mini del" data-act="del" data-path="${path}" data-i="${i}" aria-label="Delete">✕</button>
    </div>`).join('')}
    <div class="add"><input placeholder="${esc(placeholder || 'Add an item')}" data-addfor="${path}"><button class="btn small" data-act="add" data-path="${path}">Add</button></div>`;
}
function getPath(path) { return path.split('.').reduce((o, k) => o[k], S()); }

function renderSettings() {

    : '<div class="hint">Programs land here when they end.</div>';

  const resets = st.resets.map((r, i) => `<details class="reset-edit" data-id="set-r:${i}" ${isOpen('set-r:' + i, false) ? 'open' : ''}><summary>${esc(r.name || 'Untitled reset')}${r.start ? ' <span class="tag Moderate">Start here</span>' : ''}<span class="chev"></span></summary>

        </select></label>

      </div>
      <label class="field"><span>Evidence note</span><textarea data-edit="reset" data-i="${i}" data-f="note">${esc(r.note || '')}</textarea></label>
      ${r.eft ? `
        <label class="field"><span>Plain note (always shown)</span><textarea data-edit="reset" data-i="${i}" data-f="plain">${esc(r.plain || '')}</textarea></label>
        <label class="field"><span>Steps, one per line</span><textarea data-edit="resetlines" data-i="${i}" data-f="steps" style="min-height:140px">${esc((r.steps || []).join('\n'))}</textarea></label>
        <label class="field"><span>Tapping points, one per line</span><textarea data-edit="resetlines" data-i="${i}" data-f="points" style="min-height:180px">${esc((r.points || []).join('\n'))}</textarea></label>` : ''}
      <label class="checkline"><input type="checkbox" data-edit="reset" data-i="${i}" data-f="start" ${r.start ? 'checked' : ''}> Pin to Start here</label>
      <div class="tools">
        <button class="mini" data-act="moveReset" data-i="${i}" data-dir="-1" aria-label="Move up">↑</button>
        <button class="mini" data-act="moveReset" data-i="${i}" data-dir="1" aria-label="Move down">↓</button>
        <button class="mini del" data-act="delReset" data-i="${i}" aria-label="Delete">✕</button>
      </div>
    </details>`).join('');

  const clTabs = which => `<div class="subtabs">
      <button data-act="clTab" data-w="${which}" data-m="normal" aria-pressed="${settingsTab[which] === 'normal'}">Normal</button>
      <button data-act="clTab" data-w="${which}" data-m="fog" aria-pressed="${settingsTab[which] === 'fog'}">Fog</button>
    </div>
    ${listEditor(`checklists.${which}.${settingsTab[which]}`, st.checklists[which][settingsTab[which]])}`;

  const linkField = key => `<label class="field"><span>${esc(linkLabel(key))}</span><input type="url" inputmode="url" data-edit="link" data-k="${key}" value="${esc(linkUrl(key))}"></label>`;
  const pages = {
    morning: { group: 'Today', title: 'Morning checklist', hint: 'Items and fog version', html: clTabs('morning') },

    skin: { group: 'Body', title: 'Skincare', hint: 'Steps and extra-step nights', html: `

      <div class="hint" style="margin-bottom:8px">Tap the nights that get the extra steps.</div>

      <label class="field"><span>Note on those nights</span><input data-edit="skin" data-f="extra" value="${esc(st.skin.extra)}"></label>
      <label class="field"><span>Note on other nights</span><input data-edit="skin" data-f="basic" value="${esc(st.skin.basic)}"></label>
      <label class="field"><span>Show tonight's note under this Night checklist item</span><input data-edit="skin" data-f="item" value="${esc(st.skin.item)}"></label>` },
    links: { group: 'Body', title: 'Links to your other apps', hint: 'Vero Strong, Gut Log, Daily Desk', html: `
      <div class="hint" style="margin-bottom:12px">These open your other apps. Workout on your Morning checklist opens Vero Strong, and Log what I ate opens Gut Log.</div>
      ${linkField('strong')}${linkField('gut')}${linkField('desk')}` },
    resets: { group: 'Calm', title: 'Somatic resets', hint: `${st.resets.length} resets, tap one to edit`, html: `${resets}<button class="btn" data-act="addReset">+ Add a reset</button>` },
    menu: { group: 'Calm', title: 'Dopamine menu', hint: 'Starters, Mains, Sides, Desserts, Specials', html: MENU_SECTIONS.map(sec => `<h3>${sec}</h3>${listEditor('menu.' + sec, st.menu[sec] || [])}`).join('') },
    prompts: { group: 'Journal', title: 'Journal prompts', hint: 'Morning journal and night brain dump', html: `

    week: { group: 'Week', title: 'This week and Sunday reset', hint: 'Weekly tasks, Sunday reset items', html: `

      <h3 style="margin-top:28px">Sunday reset</h3>
      <div class="subtabs">
        <button data-act="clTab" data-w="sunday" data-m="normal" aria-pressed="${settingsTab.sunday === 'normal'}">Normal</button>
        <button data-act="clTab" data-w="sunday" data-m="fog" aria-pressed="${settingsTab.sunday === 'fog'}">Fog</button>
      </div>
      ${listEditor('sunday.' + settingsTab.sunday, st.sunday[settingsTab.sunday])}` },
    backup: { group: 'Your data', title: 'Backup', hint: 'Save or restore everything', html: `
      <div class="hint" style="margin-bottom:10px">Everything lives on this phone only. Save a backup file now and then.</div>

      <input type="file" id="importFile" accept="application/json,.json" hidden>` }

  const page = pages[settingsPage];
  document.getElementById('setTitle').textContent = page ? page.title : 'Settings';
  document.getElementById('setBack').hidden = !page;
  if (page) {
    document.getElementById('settingsBody').innerHTML = `<section class="card">${page.html}</section>`;

  }
  const groups = [...new Set(Object.values(pages).map(x => x.group))];
  document.getElementById('settingsBody').innerHTML = groups.map(g => `
    <div class="set-group">${g}</div>
    <section class="card set-list">
      ${Object.entries(pages).filter(([, x]) => x.group === g).map(([key, x]) => `
        <button class="set-row" data-act="setPage" data-p="${key}"><div><b>${x.title}</b><span>${esc(x.hint)}</span></div><span class="chev" style="transform:rotate(-45deg)"></span></button>`).join('')}
    </section>`).join('');
}
let settingsPage = '';

function openSettings(pageKey) {
  settingsPage = pageKey || '';
  renderSettings();
  const el = document.getElementById('settings');
  el.classList.add('open');
  el.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeSettings() {
  document.getElementById('settings').classList.remove('open');
  document.body.style.overflow = '';
  save(); render();
}

// ---------- Actions ----------
function newProgram() {
  const cur = S().program;
  if (cur) {
    if (!confirm('Move "' + (cur.name || 'this program') + '" to Finished and start a new one?')) return;
    S().finished.unshift({ name: cur.name, weeks: cur.weeks, start: cur.start, end: todayKey(), focus: cur.focus, early: true });
  }
  S().program = { name: '', weeks: 6, start: nextSunday(), focus: [] };
  save();
  openSettings('program');
  setTimeout(() => document.querySelector('[data-edit="prog"][data-f="name"]')?.focus(), 50);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) {
    if (e.target.id === 'triggerSheet') closeTrigger();
    return;
  }
  const a = b.dataset.act, st = S(), d = day();
  const i = Number(b.dataset.i), dir = Number(b.dataset.dir);
  switch (a) {
    case 'toggleFog': d.fog = !d.fog; save(); render(); break;
    case 'tab': tab = b.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'openTrigger': openTrigger(); break;
    case 'skinDay': { const n = Number(b.dataset.d); const ds = st.skin.days; const j = ds.indexOf(n); j >= 0 ? ds.splice(j, 1) : ds.push(n); ds.sort(); save(); renderSettings(); break; }
    case 'wcheck': { const w = week(); w.checks[b.dataset.key] = !w.checks[b.dataset.key]; save(); render(); break; }
    case 'check': d.checks[b.dataset.key] = !d.checks[b.dataset.key]; save(); render(); break;
    case 'pickTrigger': pickedTrigger = b.dataset.t; { const note = document.getElementById('triggerNote').value; renderTriggerSheet(); document.getElementById('triggerNote').value = note; } break;
    case 'saveTrigger':
      if (!pickedTrigger) return;
      state.triggerLog.unshift({ ts: Date.now(), trigger: pickedTrigger, note: document.getElementById('triggerNote').value.trim() });
      save(); pickedTrigger = null; renderTriggerSheet();
      b.textContent = 'Saved';
      setTimeout(closeTrigger, 500);
      break;
    case 'closeTrigger': closeTrigger(); break;
    case 'openSettings': openSettings(); break;
    case 'closeSettings': closeSettings(); break;
    case 'newProgram': newProgram(); break;
    case 'setPage': settingsPage = b.dataset.p; renderSettings(); document.getElementById('settings').scrollTop = 0; break;
    case 'finishNow':
      if (!confirm('Move this program to Finished?')) return;
      st.finished.unshift({ name: st.program.name, weeks: st.program.weeks, start: st.program.start, end: todayKey(), focus: st.program.focus, early: true });
      st.program = null; save(); renderSettings(); break;
    case 'reuse': {
      const f = st.finished[i];
      if (st.program && !confirm('Replace the current program? It will move to Finished.')) return;
      if (st.program) st.finished.unshift({ name: st.program.name, weeks: st.program.weeks, start: st.program.start, end: todayKey(), focus: st.program.focus, early: true });
      st.program = { name: f.name, weeks: f.weeks, start: nextSunday(), focus: clone(f.focus || []) };
      save(); renderSettings(); document.getElementById('settings').scrollTop = 0; break;
    }
    case 'delFinished': if (confirm('Remove this from Finished?')) { st.finished.splice(i, 1); save(); renderSettings(); } break;
    case 'move': case 'del': case 'add': {
      const list = getPath(b.dataset.path);
      if (a === 'move') { const j = i + dir; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; }
      if (a === 'del') list.splice(i, 1);
      if (a === 'add') { const inp = document.querySelector(`[data-addfor="${b.dataset.path}"]`); const v = inp.value.trim(); if (!v) return; list.push(v); }
      save(); renderSettings();
      if (a === 'add') document.querySelector(`[data-addfor="${b.dataset.path}"]`)?.focus();
      break;
    }
    case 'clTab': settingsTab[b.dataset.w] = b.dataset.m; renderSettings(); break;
    case 'moveReset': { const j = i + dir; if (j < 0 || j >= st.resets.length) return; [st.resets[i], st.resets[j]] = [st.resets[j], st.resets[i]]; save(); renderSettings(); break; }
    case 'delReset': if (confirm('Delete "' + st.resets[i].name + '"?')) { st.resets.splice(i, 1); save(); renderSettings(); } break;
    case 'addReset': st.resets.push({ name: 'New reset', how: '', level: '', note: '' }); save(); renderSettings(); document.querySelector('.reset-edit:last-of-type input')?.select(); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = 'rhythm-backup-' + todayKey() + '.json'; a2.click();
      setTimeout(() => URL.revokeObjectURL(a2.href), 1000); break;
    }
    case 'import': document.getElementById('importFile').click(); break;
  }
});

document.addEventListener('input', e => {
  const el = e.target, st = S();
  if (el.id === 'food') {
    day().food = el.value; save();
    const s = document.getElementById('foodSaved'); if (s) { s.textContent = 'Saved'; clearTimeout(s._t); s._t = setTimeout(() => s.textContent = '', 1200); }
    return;
  }
  const kind = el.dataset.edit; if (!kind) return;
  const i = Number(el.dataset.i), f = el.dataset.f;
  if (kind === 'list') getPath(el.dataset.path)[i] = el.value;
  if (kind === 'prog') {
    if (f === 'weeks') { const n = parseInt(el.value, 10); if (!(n >= 1 && n <= 52)) return; st.program.weeks = n; save(); return; }
    if (f === 'start' && !el.value) return;
    st.program[f] = el.value;
  }
  if (kind === 'sprint') {
    if ((f === 'start' || f === 'end') && !el.value) return;
    else st.sprint[f] = el.value;
  }
  if (kind === 'skin') st.skin[f] = el.value;
  if (kind === 'journal') st.journal[f] = el.value;
  if (kind === 'brainDump') st.brainDump[f] = el.value;
  if (kind === 'link') { st.links[el.dataset.k] = Object.assign({}, st.links[el.dataset.k], { url: el.value.trim() }); }
  if (kind === 'focus') st.program.focus[i] = el.value;
  if (kind === 'reset') st.resets[i][f] = el.type === 'checkbox' ? el.checked : el.value;
  if (kind === 'resetlines') st.resets[i][f] = el.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (kind === 'goal') st.workoutGoal = Math.max(0, parseInt(el.value, 10) || 0);
  save();
});
// Re-draw week focus fields when the week count changes
document.addEventListener('change', e => {
  if (e.target.dataset.edit === 'prog' && e.target.dataset.f === 'weeks') renderSettings();
  if (e.target.dataset.edit === 'reset' && e.target.type === 'checkbox') save();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.addfor) { e.preventDefault(); document.querySelector(`[data-act="add"][data-path="${e.target.dataset.addfor}"]`).click(); }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  e.target.files[0].text().then(txt => {
    try {
      const data = JSON.parse(txt);
      if (!data.settings) throw new Error('bad');
      if (!confirm('Replace everything on this phone with this backup?')) return;
      localStorage.setItem(KEY, JSON.stringify(data));
      state = load(); renderSettings(); render();
    } catch (err) { alert('That file does not look like a Rhythm backup.'); }
  });
});

document.addEventListener('toggle', e => {
  if (e.target.matches && e.target.matches('details[data-id]')) clOpen[e.target.dataset.id] = e.target.open;
}, true);

// Refresh when the day or time of day changes. Coming back after 30+ minutes
// counts as opening the app, so a fog day lands on Reset again.
let hiddenAt = 0;
function refreshIfStale() {
  if (todayKey() !== shownDay) { shownDay = todayKey(); tab = day().fog ? 'calm' : 'today'; clOpen = {}; shownSlot = timeSlot(); render(); return; }
  if (timeSlot() !== shownSlot && !document.activeElement?.matches('textarea, input')) { shownSlot = timeSlot(); clOpen = {}; render(); }
}
// Refresh when the app comes back after midnight
let shownDay = todayKey();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 30 * 60000 && day().fog && tab !== 'calm') { tab = 'calm'; render(); window.scrollTo(0, 0); }
  refreshIfStale();
});
setInterval(refreshIfStale, 60000);

if (!localStorage.getItem(KEY)) save();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
